<!doctype html>
<html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071012"><title>DartArena • Privacy request preview</title><link rel="icon" href="./assets/icons/favicon-32.png"><link rel="stylesheet" href="style.css?v=20261025-originalcrisp1"><link rel="stylesheet" href="dartboard-background.css?v=20261025-originalcrisp1"><link rel="stylesheet" href="button-theme.css?v=20261009-brandcyan1"><link rel="stylesheet" href="brand-header.css?v=20261009-mobile1"><style>.privacy-shell{position:relative;z-index:1;width:min(900px,94vw);margin:24px auto 60px}.privacy-shell [hidden]{display:none!important}.privacy-shell .card{padding:clamp(16px,3vw,28px);margin:14px 0}.privacy-shell label{display:block;margin:12px 0}.privacy-shell select,.privacy-shell input{max-width:100%;background:#102326;color:#e7f4f5;border:1px solid #284249;padding:8px;border-radius:6px}.privacy-shell .actions{display:flex;gap:8px;flex-wrap:wrap}.privacy-shell .request{border:1px solid #284249;border-radius:12px;padding:14px;margin:12px 0}.privacy-shell .request h3{margin:0 0 8px;color:#00eaf4}.privacy-shell button:focus-visible,.privacy-shell a:focus-visible{outline:2px solid #00eaf4;outline-offset:3px}.privacy-shell .notice{border-left:3px solid #00eaf4;padding-left:12px}.privacy-shell .muted{overflow-wrap:anywhere}</style></head>
