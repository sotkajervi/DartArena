<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071012">
  <title>DartArena • Kampstatistikk</title>
  <link rel="stylesheet" href="style.css?v=20260928-ui2">
  <link rel="stylesheet" href="dartboard-background.css?v=20260928-ui2">
  <link rel="stylesheet" href="button-theme.css?v=20260928-ui2">
  <style>
    .stats-wrap{max-width:980px;margin:0 auto}.stats-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.stats-result{text-align:center;font-size:clamp(32px,7vw,64px);font-weight:950;color:var(--cyan);margin:6px 0 24px}.match-stats-grid{display:grid;grid-template-columns:190px 1fr 1fr;border:1px solid rgba(255,255,255,.09);border-radius:16px;overflow:hidden}.match-stats-grid>*{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.065)}.match-stats-grid>*:nth-last-child(-n+3){border-bottom:0}.match-stats-grid .label{color:var(--muted)}.match-stats-grid .head{text-align:center;color:var(--cyan);font-weight:900}.match-stats-grid .value{text-align:center;font-size:18px;font-weight:900}.leg-list{display:grid;gap:8px;margin-top:10px}.leg-row{display:grid;grid-template-columns:90px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px}.leg-winner{font-weight:850}.leg-meta{color:var(--muted);font-size:13px}.stats-note{text-align:center;margin-top:14px}.stats-section{margin-top:22px}@media(max-width:650px){.stats-head{flex-direction:column}.match-stats-grid{grid-template-columns:115px 1fr 1fr}.match-stats-grid>*{padding:9px 5px;font-size:12px}.match-stats-grid .value{font-size:14px}.leg-row{grid-template-columns:65px 1fr}.leg-meta{grid-column:2}}
  </style>
</head>
<body>
  <header><div class="brand">DART<span>ARENA</span></div><div class="live"><i></i> Kampstatistikk</div></header>
  <main class="shell"><div class="stats-wrap">
    <div class="stats-head"><div><small>FERDIG KAMP</small><h1 id="statsTitle">Laster…</h1><p id="statsMeta" class="muted compact"></p></div><button id="backBtn" class="outline">Til kamphistorikk</button></div>
    <section class="card"><div id="statsResult" class="stats-result">–</div><div id="statsBody"><p class="muted stats-note">Laster kampstatistikk…</p></div></section>
  </div></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="x01-stats.js?v=20260929-first9a"></script>
  <script src="match-stats.js?v=20260929-history1"></script>
  <script src="role-visuals.js?v=20260929-history1"></script>
</body>
</html>
