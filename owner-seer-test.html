<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071012">
  <title>DartArena · SEER-test</title>
  <link rel="icon" href="assets/icons/favicon-32.png">
  <link rel="stylesheet" href="style.css?v=20261025-originalcrisp1">
  <link rel="stylesheet" href="button-theme.css?v=20261009-brandcyan1">
  <link rel="stylesheet" href="brand-header.css?v=20261009-mobile1">
  <style>
    .seer-shell { width: min(760px, 94vw); margin: 24px auto 60px; }
    .seer-shell [hidden] { display: none !important; }
    .seer-shell .card { margin: 14px 0; padding: clamp(16px, 3vw, 28px); }
    .seer-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .seer-signals { display: flex; flex-wrap: wrap; gap: 12px 28px; }
    .seer-signals dt { color: var(--muted); }
    .seer-signals dd { margin: 4px 0 0; font-variant-numeric: tabular-nums; }
    #seerDarts { padding: 0; list-style: none; }
    #seerDarts li { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    #seerDarts select, #seerScenario { max-width: 100%; padding: 8px; background: #102326; color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
    #seerNotes { margin-block: 16px; }
    #seerLog { padding-left: 1.4rem; overflow-wrap: anywhere; }
    #seerLog li { margin-bottom: 12px; }
    #seerLog summary { cursor: pointer; }
    #seerLog pre { white-space: pre-wrap; overflow: auto; max-height: 18rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><a href="index.html"><img class="brand-logo" src="assets/dartarena-logo.jpg?v=20261009-global1" alt="DartArena" width="420" height="116"></a></div>
  </header>
  <main class="shell seer-shell">
    <a href="admin-center.html" class="outline">Admin Center</a>
    <section class="card">
      <h1>SEER-test</h1>
      <p id="seerAccess" role="status">Kontrollerer Owner-tilgang …</p>
      <div id="seerTest" hidden>
        <form id="seerForm">
          <label class="field"><span id="seerIdLabel">Skive-ID fra SEER</span>
            <input id="seerBoard" type="text" required autocomplete="off" spellcheck="false" autocapitalize="none">
          </label>
          <div class="seer-actions">
            <button id="seerConnect" class="primary" type="submit">Koble til</button>
            <button id="seerDisconnect" class="outline" type="button" disabled>Koble fra</button>
            <select id="seerScenario" aria-label="Velg testdata">
              <option value="single">T20</option>
              <option value="repeat">T20 · gjentatt melding</option>
              <option value="two">To piler i S20</option>
              <option value="conflict">Uenige kameraer</option>
            </select>
            <button id="seerDemo" class="outline" type="button">Vis testdata</button>
          </div>
        </form>
        <dl class="seer-signals">
          <div><dt id="seerServerLabel">SEER-server</dt><dd id="seerStatus" role="status">Frakoblet</dd></div>
          <div><dt id="seerPingLabel">Sist mottatt ping</dt><dd id="seerPing">—</dd></div>
          <div><dt id="seerScoreLabel">Sist mottatt kast</dt><dd id="seerScore">—</dd></div>
        </dl>
      </div>
    </section>
    <section class="card" id="seerProposals" hidden>
      <h2 id="seerProposalTitle">Kastforslag</h2>
      <ol id="seerDarts"></ol>
      <p id="seerVisitTotal" role="status"></p>
    </section>
    <section class="card" id="seerEvents" hidden>
      <h2 id="seerLogTitle">Hendelseslogg</h2>
      <p id="seerLast" class="muted"></p>
      <div class="seer-actions">
        <button id="seerSave" class="primary" type="button" disabled>Lagre testlogg (.json)</button>
        <button id="seerClear" class="outline" type="button" disabled>Tøm logg</button>
      </div>
      <form id="seerNotes">
        <label class="field"><span id="seerNoteLabel">Kastnotat (tas med i eksporten)</span>
          <input id="seerNote" type="text" maxlength="240" placeholder="Faktisk T20" autocomplete="off">
        </label>
        <div class="seer-actions">
          <button id="seerAddNote" class="outline" type="submit">Legg til notat</button>
          <button id="seerRemoved" class="outline" type="button">Pilene tatt ut</button>
        </div>
      </form>
      <ol id="seerLog"></ol>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js"></script>
  <script src="dartarena-i18n.js?v=20261126-menuorder1"></script>
  <script src="seer-visit.js?v=20261127-throws1"></script>
  <script src="owner-seer-test.js?v=20261127-throws1"></script>
</body>
</html>
