name: Fair play and terms draft
on:
  push:
    branches: ['test/fair-play-terms-20261127']
  pull_request:
    branches: [main]
    paths: ['fair-play.html','dartarena-i18n.js','docs/terms-of-use-draft-20261127.md','tests/fair-play-terms.test.cjs','.github/workflows/fair-play-terms.yml']
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/fair-play-terms.test.cjs
