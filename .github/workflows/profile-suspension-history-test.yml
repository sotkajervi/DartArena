name: Profile suspension history
on:
  push:
    branches: [test/profile-suspension-history-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check player-suspensions.js && node --check player-suspension-history.js
      - run: node --test tests/profile-suspension-history.test.cjs
