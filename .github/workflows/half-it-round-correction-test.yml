name: Half-It round correction isolated test
on:
  push:
    branches: ['test/half-it-round-correction-20261125']
permissions:
  contents: read
jobs:
  correction:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated
          POSTGRES_DB: half_it_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated
      PGDATABASE: half_it_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check half-it-round-correction.js && node --check half-it-bootstrap.js
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/half-it-correction-schema.sql -f db/half-it-round-correction-candidate.sql
      - run: node tests/half-it-round-correction.cjs
      - run: node --test tests/half-it-online-layout.test.cjs tests/half-it-starter-41.test.cjs tests/half-it-viewer-count.test.cjs
      - run: psql -X -v ON_ERROR_STOP=1 -f db/half-it-round-correction-rollback.sql
