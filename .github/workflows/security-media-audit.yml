name: Media security offline audit
on:
  push:
    branches: [test/security-media-audit-20261127]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: media_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/media-secret-scan.cjs
      - run: psql -h localhost -U postgres -d media_test -f tests/security-media-auth.sql
        env:
          PGPASSWORD: test
