name: API abuse isolation
on:
  push:
    branches: ['test/security-api-abuse-20261127']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rate-guard-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: abuse_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect existing guard in disposable PostgreSQL
        env:
          PGPASSWORD: test
        run: python3 tests/api-abuse-baseline.py
      - name: Reset local fixture database and roles
        env:
          PGPASSWORD: test
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE abuse_test' -c 'DROP ROLE authenticated, anon' -c 'CREATE DATABASE abuse_test'
      - name: Require candidate concurrency protection
        env:
          PGPASSWORD: test
        run: python3 tests/api-abuse-baseline.py --candidate
