name: 61 combined start and responsive sidebar regression
on:
  push:
    branches: ['test/61-combined-fit3-20261125']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node --check sixty-one-shared-start.js
      - run: node --test tests/sixty-one-start-sync.test.cjs tests/sixty-one-x01-layout.test.cjs tests/shared-online-result-labels.test.cjs
