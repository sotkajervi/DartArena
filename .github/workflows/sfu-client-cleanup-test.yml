name: SFU client cleanup offline tests
on:
  push:
    branches: [test/sfu-client-cleanup-20261127]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check sfu-client-secure.js
      - run: node --test tests/sfu-client-cleanup.test.cjs
