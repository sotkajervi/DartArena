name: Pentathlon Shanghai round breakdown test
on:
  push:
    branches: ['test/pentathlon-shanghai-rounds-20261125']
permissions:
  contents: read
jobs:
  breakdown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check pentathlon-room-test.js
      - run: node --test tests/pentathlon-stage-points.test.cjs tests/pentathlon-2p.test.cjs tests/pentathlon-room-test.test.cjs tests/pentathlon-cancellation.test.cjs tests/pentathlon-leg-selector.test.cjs
