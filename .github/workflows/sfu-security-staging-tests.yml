name: SFU staging security tests
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'cloudflare/sfu-security.test.mjs'
      - 'cloudflare/sfu-authorization-contract.test.mjs'
      - 'cloudflare/can-access-sfu-room.staging.sql'
      - 'cloudflare/sfu-authorization-pg-fixture.sql'
      - 'cloudflare/sfu-authorization-pg-assert.sql'
      - 'cloudflare/sfu-config.test.mjs'
      - 'cloudflare/sfu-bootstrap-safe.test.mjs'
      - 'cloudflare/sfu-bootstrap-safe.js'
      - 'cloudflare/wrangler.bootstrap.jsonc'
      - 'cloudflare/wrangler.staging.example.jsonc'
      - 'cloudflare/dartarena-realtime.staging.js'
      - '.github/workflows/sfu-security-staging-tests.yml'
  push:
    branches:
      - security/sfu-auth-staging-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-security:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: sfutest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sfutest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Node runtime
        run: node --version
      - name: Run isolated SFU security tests
        run: node --test cloudflare/sfu-security.test.mjs cloudflare/sfu-config.test.mjs cloudflare/sfu-bootstrap-safe.test.mjs cloudflare/sfu-authorization-contract.test.mjs
      - name: Execute SQL authorization scenarios in ephemeral PostgreSQL (no Supabase calls)
        env:
          PGPASSWORD: testing-only
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d sfutest -f cloudflare/sfu-authorization-pg-fixture.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d sfutest -f cloudflare/can-access-sfu-room.staging.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d sfutest -f cloudflare/sfu-authorization-pg-assert.sql
      - name: Wrangler compile-only validation (no upload)
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config cloudflare/wrangler.staging.example.jsonc --outdir /tmp/dartarena-sfu-dryrun
      - name: Wrangler safe bootstrap compile only (no upload)
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config cloudflare/wrangler.bootstrap.jsonc --outdir /tmp/dartarena-bootstrap-dryrun
      - name: Live bootstrap smoke test (read-only, no deployment)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'https://dartarena-realtime-security-test.sotkajervi.workers.dev';
          const health = await fetch(base + '/health');
          assert.equal(health.status, 200);
          const body = await health.json();
          assert.equal(body.ok, true);
          assert.equal(body.mode, 'bootstrap');
          assert.equal(body.mediaEnabled, false);
          for (const path of ['/api/sfu/session', '/api/sfu/publish', '/api/sfu/subscribe', '/api/sfu/renegotiate']) {
            const response = await fetch(base + path, { method: 'POST' });
            assert.equal(response.status, 503, path + ' must be disabled');
            const data = await response.json();
            assert.equal(data.ok, false);
          }
          console.log('Live bootstrap smoke test: 5/5 checks passed');
          NODE

  bootstrap-approval:
    name: Bootstrap isolated Cloudflare test Worker (approval required)
    needs: staging-security
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/security/sfu-auth-staging-20261028' &&
      contains(github.event.head_commit.message, '[bootstrap-sfu-test]')
    environment: cloudflare-security-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify target and fail-closed bootstrap
        run: |
          node --test cloudflare/sfu-bootstrap-safe.test.mjs
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('cloudflare/wrangler.bootstrap.jsonc','utf8').replace(/^\s*\/\/.*$/gm,''));
          if(config.name!=='dartarena-realtime-security-test'||config.keep_vars!==true||config.main!=='sfu-bootstrap-safe.js') process.exit(1);
          if(config.durable_objects?.bindings?.[0]?.name!=='SFU_ROOMS'||config.durable_objects.bindings[0].class_name!=='SfuRoom')process.exit(1);
          if(config.migrations?.[0]?.new_sqlite_classes?.[0]!=='SfuRoom')process.exit(1);
          NODE
      - name: Deploy bootstrap only after environment approval
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.45.0 deploy --config cloudflare/wrangler.bootstrap.jsonc
