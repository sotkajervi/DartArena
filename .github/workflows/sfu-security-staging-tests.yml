name: SFU staging security tests
on:
  pull_request:
    paths:
      - 'cloudflare/sfu-security.test.mjs'
      - 'cloudflare/sfu-config.test.mjs'
      - 'cloudflare/wrangler.staging.example.jsonc'
      - 'cloudflare/dartarena-realtime.staging.js'
      - '.github/workflows/sfu-security-staging-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-security:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Node runtime
        run: node --version
      - name: Run isolated SFU security tests
        run: node --test cloudflare/sfu-security.test.mjs cloudflare/sfu-config.test.mjs
