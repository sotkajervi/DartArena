name: Career statistics integrity test
on:
  push:
    branches: [test/career-statistics-integrity-20261124]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated
          POSTGRES_DB: career_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated
      PGDATABASE: career_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: psql -X -v ON_ERROR_STOP=1 -f tests/career-statistics-schema.sql -f db/career-statistics-integrity-rollback.sql -f db/career-statistics-integrity-candidate.sql
      - run: node tests/career-statistics-integrity.cjs
