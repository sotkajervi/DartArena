name: Half-It correction card layout regression
on:
  push:
    branches: ['test/half-it-correction-card-layout-20261125']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check half-it-round-correction.js
          node --test tests/half-it-correction-card-layout.test.cjs tests/half-it-enter-autofill.test.cjs tests/half-it-starter-41.test.cjs tests/half-it-online-layout.test.cjs
