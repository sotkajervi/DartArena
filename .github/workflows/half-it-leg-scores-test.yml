name: Half-It leg scores regression
on:
  push:
    branches: ['test/half-it-leg-scores-20261125']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check shared-results.js
          node --test tests/half-it-leg-scores.test.cjs tests/half-it-single-result.test.cjs tests/result-stat-row-align.test.cjs tests/half-it-enter-autofill.test.cjs tests/half-it-score-correction.test.cjs
