name: Private challenge blocks
on:
  push:
    branches: ['test/player-blocks-20261126']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: block_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          for f in player-blocks.js app.js challenge-outgoing.js dartarena-i18n.js; do node --check "$f" || exit 1; done
          node --test tests/challenge-outgoing.test.cjs tests/lobby-social.test.cjs tests/new-games-i18n.test.cjs tests/player-details.test.cjs
      - run: PGPASSWORD=test psql -h localhost -U postgres -d block_test -f tests/player-blocks-db.sql
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/player-blocks-browser.test.cjs tests/player-reports-browser.test.cjs
