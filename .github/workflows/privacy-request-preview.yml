name: Privacy request preview
on:
  push:
    branches: ['test/privacy-account-lifecycle-20261127']
  pull_request:
    branches: [main]
    paths: ['owner-privacy-preview.*','privacy-request-model.js','tests/privacy-request-preview.test.cjs','.github/workflows/privacy-request-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/privacy-request-preview.test.cjs
