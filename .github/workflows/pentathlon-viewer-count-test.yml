name: Pentathlon viewer count test
on:
  push:
    branches: ['test/pentathlon-viewer-count-20261125']
permissions:
  contents: read
jobs:
  viewer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check challenge-same-page-handoff-dev.js
      - run: node --test tests/pentathlon-viewer-count.test.cjs tests/pentathlon-special-buttons.test.cjs tests/pentathlon-stage-points.test.cjs tests/pentathlon-2p.test.cjs tests/pentathlon-room-test.test.cjs tests/pentathlon-cancellation.test.cjs tests/pentathlon-leg-selector.test.cjs
