name: Half-It between-leg popup regression
on:
  push:
    branches: ['test/half-it-leg-popup-20261125']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check half-it-leg-break.js
          node --test tests/half-it-leg-break.test.cjs tests/half-it-leg-scores.test.cjs tests/half-it-single-result.test.cjs tests/half-it-starter-41.test.cjs tests/half-it-enter-autofill.test.cjs tests/half-it-score-correction.test.cjs
