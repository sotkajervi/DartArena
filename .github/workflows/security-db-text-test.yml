name: Database text and avatar security
on:
  push:
    branches: [test/security-db-text-20261127]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: profile_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: psql -h localhost -U postgres -d profile_test -f tests/security-db-text.sql
        env:
          PGPASSWORD: test
      - run: node --test tests/player-identity.test.cjs tests/player-details.test.cjs
