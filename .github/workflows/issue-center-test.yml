name: Issue Center isolated validation
on:
  pull_request:
    paths:
      - 'issue-center.js'
      - 'supabase-issue-center*.sql'
      - 'tests/issue-center*'
      - '.github/workflows/issue-center-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: issue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check issue-center.js && node --test tests/issue-center.test.cjs
      - run: psql -h localhost -U postgres -d issue_test -f tests/issue-center-db.sql
        env:
          PGPASSWORD: test
      - name: Verify 30-day diagnostics expiry, preservation and access control
        run: psql -h localhost -U postgres -d issue_test -f tests/issue-center-retention-db.sql
        env:
          PGPASSWORD: test
      - name: Verify media runtime unchanged and updated SFU regression
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --exit-code "$BASE_SHA" HEAD -- media-transport.js owner-media-switch.js room-media-router.js match-media-router.js sfu-config.js sfu-client-secure.js match-sfu-media-secure.js room-sfu-media-secure.js tournament-match-room.js tournament-room-preferred-media.js match-spectator-broadcast.js
          node --test tests/owner-sfu-rollback.test.cjs
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/issue-browser" --no-save --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/issue-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser report and staff workflow (mock API, no production requests)
        run: NODE_PATH="$RUNNER_TEMP/issue-browser/node_modules" node --test tests/issue-center-browser.test.cjs
