name: Issue Center isolated validation
on:
  pull_request:
    paths:
      - 'issue-center.js'
      - 'supabase-issue-center.sql'
      - 'tests/issue-center*'
      - '.github/workflows/issue-center-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: issue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check issue-center.js && node --test tests/issue-center.test.cjs
      - run: psql -h localhost -U postgres -d issue_test -f tests/issue-center-db.sql
        env:
          PGPASSWORD: test
