name: Issue Center isolated validation
on:
  pull_request:
    paths:
      - 'issue-center.js'
      - 'supabase-issue-center.sql'
      - 'tests/issue-center*'
      - '.github/workflows/issue-center-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: issue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check issue-center.js && node --test tests/issue-center.test.cjs
      - run: psql -h localhost -U postgres -d issue_test -f tests/issue-center-db.sql
        env:
          PGPASSWORD: test
      - name: Compare existing SFU regression against PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/issue-baseline" "$BASE_SHA"
          (cd "$RUNNER_TEMP/issue-baseline" && node --test tests/owner-sfu-rollback.test.cjs > "$RUNNER_TEMP/base-sfu.txt" 2>&1) || true
          node --test tests/owner-sfu-rollback.test.cjs > "$RUNNER_TEMP/head-sfu.txt" 2>&1 || true
          grep '^not ok ' "$RUNNER_TEMP/base-sfu.txt" > "$RUNNER_TEMP/base-failures.txt" || true
          grep '^not ok ' "$RUNNER_TEMP/head-sfu.txt" > "$RUNNER_TEMP/head-failures.txt" || true
          cat "$RUNNER_TEMP/base-failures.txt"
          diff -u "$RUNNER_TEMP/base-failures.txt" "$RUNNER_TEMP/head-failures.txt"
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/issue-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/issue-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser report and staff workflow (mock API, no production requests)
        run: NODE_PATH="$RUNNER_TEMP/issue-browser/node_modules" node --test tests/issue-center-browser.test.cjs
