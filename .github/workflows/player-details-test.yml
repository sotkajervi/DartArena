name: Player profiles isolated validation
on:
  push:
    branches: ['test/player-profiles-20261126']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: profile_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check player-details.js
          node --check player-profile.js
          node --check dartarena-i18n.js
          node --test tests/player-details.test.cjs tests/new-games-i18n.test.cjs
      - run: psql -h localhost -U postgres -d profile_test -f tests/player-details-db.sql
        env:
          PGPASSWORD: test
