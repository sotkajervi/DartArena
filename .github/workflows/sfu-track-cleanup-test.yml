name: SFU track cleanup offline tests
on:
  push:
    branches: [test/sfu-track-cleanup-20261127]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/sfu-cost-guard.test.cjs
