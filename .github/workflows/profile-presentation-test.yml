name: Profile presentation and shared avatars
on:
  push:
    branches: ['test/profile-presentation-20261126']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: profile_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          for f in profile-name-link.js player-details.js player-profile.js match-history.js premium-match-stats.js hall-of-fame.js tournament-results.js lobby-social.js players.js form-stats.js dartarena-i18n.js; do node --check "$f" || exit 1; done
          node --test tests/profile-presentation.test.cjs tests/profile-name-link.test.cjs tests/player-identity.test.cjs tests/player-details.test.cjs tests/new-games-i18n.test.cjs
      - run: PGPASSWORD=test psql -h localhost -U postgres -d profile_test -f tests/profile-presentation-db.sql
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/player-details-browser.test.cjs tests/profile-name-link-browser.test.cjs tests/avatar-crop-browser.test.cjs
