name: Secret history diagnostic
on:
  push:
    branches: ['test/security-secret-history-20261127']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan fetched Git history without emitting secret values
        run: python3 tests/secret-history-scan.py
