name: Auth password policy test
on:
  push:
    branches: [test/auth-password-policy-20261124]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node tests/auth-password-policy.test.cjs
