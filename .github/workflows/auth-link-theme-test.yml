name: Auth link theme
on:
  push:
    branches: [test/auth-link-theme-20261127]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/auth-link-theme.test.cjs
