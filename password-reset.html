<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nytt passord – DartArena</title>
  <link rel="icon" href="assets/icons/favicon-32.png">
  <link rel="stylesheet" href="style.css?v=20260928-ui2">
  <link rel="stylesheet" href="dartboard-background.css?v=20260928-ui2">
  <link rel="stylesheet" href="button-theme.css?v=20261009-brandcyan1">
  <style>main{max-width:520px;margin:8vh auto;padding:16px} [hidden]{display:none!important} .message{min-height:3em} a{color:#40e0dd}</style>
</head>
<body>
  <main><section class="card">
    <small>DARTARENA</small>
    <h1>Nytt passord</h1>
    <p>Bruk e-postadressen til den eksisterende kontoen din.</p>
    <p id="resetMessage" class="message" role="status" aria-live="polite"></p>
    <form id="requestForm">
      <label class="field">E-post<input id="resetEmail" type="email" autocomplete="email" required maxlength="254"></label>
      <button id="sendReset" type="submit" class="primary wide">Send tilbakestillingslenke</button>
    </form>
    <form id="passwordForm" hidden>
      <label class="field">Nytt passord<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label>
      <label class="field">Gjenta nytt passord<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label>
      <p class="muted">Bruk minst 12 tegn og et passord du ikke bruker andre steder.</p>
      <button id="savePassword" type="submit" class="primary wide" disabled>Lagre nytt passord</button>
    </form>
    <p><a href="index.html">Tilbake til innlogging</a></p>
  </section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script type="module" src="password-reset.js?v=20261015-reset1"></script>
</body>
</html>
