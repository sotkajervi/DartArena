<!doctype html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071012"><title>DartArena • Spectate</title><link rel="stylesheet" href="style.css?v=20260928-ui2"><link rel="stylesheet" href="button-theme.css?v=20260930-buttons4"><link rel="stylesheet" href="dartboard-background.css?v=20260928-ui2"><style>.spectate-shell{width:min(1180px,94vw);margin:26px auto}.spectate-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px}.spectate-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.spectate-video{aspect-ratio:16/9;background:#030708;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}.spectate-video video{width:100%;height:100%;object-fit:contain;background:#030708}.spectate-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center}.spectate-name{position:absolute;left:10px;bottom:10px;background:#061012dc;border:1px solid var(--line);padding:6px 9px;border-radius:8px;font-weight:900}.spectate-score{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.spectate-player{padding:16px;border:1px solid var(--line);border-radius:14px;background:#091416}.spectate-player strong{display:block;font-size:44px;color:var(--cyan);margin-top:6px}.spectate-meta{margin-top:12px}.spectate-meta-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}@media(max-width:700px){.spectate-grid,.spectate-score{grid-template-columns:1fr}.spectate-head{align-items:flex-start;flex-direction:column}}</style></head><body><header><div class="brand">DART<span>ARENA</span></div><div class="live"><i></i> SPECTATE</div></header><main class="spectate-shell"><div class="spectate-head"><div><small>LIVE KAMP</small><h1 id="spectateTitle">Laster kamp…</h1></div><button class="outline" onclick="window.close()">Lukk</button></div><div class="spectate-grid"><div class="spectate-video"><video id="spectateVideo1" autoplay playsinline muted></video><div id="spectatePlaceholder1" class="spectate-placeholder">Venter på videostrøm…</div><span id="spectateName1" class="spectate-name">Spiller 1</span></div><div class="spectate-video"><video id="spectateVideo2" autoplay playsinline muted></video><div id="spectatePlaceholder2" class="spectate-placeholder">Venter på videostrøm…</div><span id="spectateName2" class="spectate-name">Spiller 2</span></div></div><div class="spectate-score"><article class="spectate-player"><span id="spectatePlayer1">Spiller 1</span><strong id="spectateResult1">0</strong><small id="spectateSub1">0 legs</small></article><article class="spectate-player"><span id="spectatePlayer2">Spiller 2</span><strong id="spectateResult2">0</strong><small id="spectateSub2">0 legs</small></article></div><section class="card spectate-meta"><div class="spectate-meta-row"><span>Spill</span><strong id="spectateGame">–</strong></div><div class="spectate-meta-row"><span>Format</span><strong id="spectateFormat">–</strong></div><div class="spectate-meta-row"><span>Status</span><strong id="spectateStatus">Pågår</strong></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="sfu-config.js?v=20260930-sfu1"></script><script src="sfu-client.js?v=20260930-sfu1"></script><script src="spectator-presence.js?v=20261001-viewers1"></script><script src="spectate.js?v=20261002-liveprivacy1"></script><script src="brand-home.js?v=20261001-home1"></script></body></html>
