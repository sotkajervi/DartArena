<!doctype html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071012"><title>DartArena • Spectate</title><link rel="stylesheet" href="style.css?v=20260928-ui2"><link rel="stylesheet" href="button-theme.css?v=20261009-brandcyan1"><link rel="stylesheet" href="dartboard-background.css?v=20260928-ui2"><style>.spectate-shell{width:min(1180px,94vw);margin:26px auto}.spectate-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px}.spectate-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.spectate-lane{display:grid;gap:10px}.spectate-video{aspect-ratio:16/9;background:#030708;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}.spectate-video video{width:100%;height:100%;object-fit:contain;background:#030708}.spectate-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center}.spectate-name{position:absolute;left:10px;bottom:10px;background:#061012dc;border:1px solid var(--line);padding:6px 9px;border-radius:8px;font-weight:900}.spectate-player{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(9,20,22,.94)}.spectate-player-head{font-weight:900;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spectate-score-line{display:flex;align-items:end;justify-content:space-between;gap:14px}.spectate-player strong{display:block;font-size:54px;line-height:.95;color:#00eaf4;font-weight:950}.spectate-legs{color:#00eaf4;font-size:12px;font-weight:950;letter-spacing:.08em;white-space:nowrap;margin-bottom:5px}.spectate-stat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}.spectate-stat{padding:7px 6px;border:1px solid rgba(255,255,255,.075);border-radius:9px;background:rgba(255,255,255,.025);text-align:center;min-width:0}.spectate-stat span{display:block;color:var(--muted);font-size:9px;font-weight:850;letter-spacing:.07em}.spectate-stat b{display:block;margin-top:3px;font-size:15px;font-variant-numeric:tabular-nums}.spectate-meta{margin-top:12px}.spectate-meta-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}@media(max-width:700px){.spectate-grid{grid-template-columns:1fr}.spectate-head{align-items:flex-start;flex-direction:column}.spectate-stat-grid{grid-template-columns:repeat(5,minmax(52px,1fr));overflow-x:auto}.spectate-player strong{font-size:48px}}</style></head><body><header><div class="brand">DART<span>ARENA</span></div><div class="live"><i></i> SPECTATE</div></header><main class="spectate-shell"><div class="spectate-head"><div><small>LIVE KAMP</small><h1 id="spectateTitle">Laster kamp…</h1></div><button class="outline" onclick="window.close()">Lukk</button></div><div class="spectate-grid"><div class="spectate-lane"><div class="spectate-video"><video id="spectateVideo1" autoplay playsinline muted></video><div id="spectatePlaceholder1" class="spectate-placeholder">Venter på videostrøm…</div><span id="spectateName1" class="spectate-name">Spiller 1</span></div><article class="spectate-player"><div id="spectatePlayer1" class="spectate-player-head">Spiller 1</div><div class="spectate-score-line"><strong id="spectateResult1">501</strong><small id="spectateSub1" class="spectate-legs">0 LEGS</small></div><div id="spectateStats1" class="spectate-stat-grid"><div class="spectate-stat"><span>AVG</span><b id="spectateAvg1">0.00</b></div><div class="spectate-stat"><span>100+</span><b id="spectate100P1">0</b></div><div class="spectate-stat"><span>140+</span><b id="spectate140P1">0</b></div><div class="spectate-stat"><span>180</span><b id="spectate180P1">0</b></div><div class="spectate-stat"><span>HØY UTG.</span><b id="spectateCheckout1">0</b></div></div></article></div><div class="spectate-lane"><div class="spectate-video"><video id="spectateVideo2" autoplay playsinline muted></video><div id="spectatePlaceholder2" class="spectate-placeholder">Venter på videostrøm…</div><span id="spectateName2" class="spectate-name">Spiller 2</span></div><article class="spectate-player"><div id="spectatePlayer2" class="spectate-player-head">Spiller 2</div><div class="spectate-score-line"><strong id="spectateResult2">501</strong><small id="spectateSub2" class="spectate-legs">0 LEGS</small></div><div id="spectateStats2" class="spectate-stat-grid"><div class="spectate-stat"><span>AVG</span><b id="spectateAvg2">0.00</b></div><div class="spectate-stat"><span>100+</span><b id="spectate100P2">0</b></div><div class="spectate-stat"><span>140+</span><b id="spectate140P2">0</b></div><div class="spectate-stat"><span>180</span><b id="spectate180P2">0</b></div><div class="spectate-stat"><span>HØY UTG.</span><b id="spectateCheckout2">0</b></div></div></article></div></div><section class="card spectate-meta"><div class="spectate-meta-row"><span>Spill</span><strong id="spectateGame">–</strong></div><div class="spectate-meta-row"><span>Format</span><strong id="spectateFormat">–</strong></div><div class="spectate-meta-row"><span>Status</span><strong id="spectateStatus">Pågår</strong></div></section></main><script>document.getElementById('spectateTitle').textContent='Laster Spectate-runtime…';</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" onerror="document.getElementById('spectateTitle').textContent='Supabase-biblioteket kunne ikke lastes'"></script><script src="role-visuals.js?v=20261002-spectate1"></script><script src="sfu-config.js?v=20260930-sfu1"></script><script src="sfu-client.js?v=20260930-sfu1"></script><script src="spectator-presence.js?v=20261002-viewers2"></script><script src="spectate-runtime.js?v=20261002-noaudio1" onerror="document.getElementById('spectateTitle').textContent='Spectate-runtime kunne ikke lastes'"></script><script src="spectate-role-polish.js?v=20261002-role2"></script><script
