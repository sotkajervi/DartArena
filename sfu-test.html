<!doctype html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071012"><title>DartArena • SFU-test</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">DART<span>ARENA</span></div><div class="live"><i></i> SFU-test</div></header><main class="shell"><section class="card"><small>CLOUDFLARE REALTIME</small><h1>Videotest</h1><p id="status" class="muted">Klar til test.</p><div class="video-grid waiting-video-grid"><div class="video-card"><video id="localVideo" autoplay playsinline muted></video><div class="video-name">Ditt kamera</div></div><div class="video-card"><video id="remoteVideo" autoplay playsinline></video><div class="video-name">Mottatt via SFU</div></div></div><div class="camera-controls"><button id="publishBtn" class="primary">1. Start og publiser kamera</button></div><label class="field">Publisering fra den andre enheten<textarea id="publication" rows="4" placeholder='{"sessionId":"...","tracks":["camera","microphone-1"]}'></textarea></label><div class="camera-controls"><button id="subscribeBtn" class="outline">2. Koble til publisering</button></div><label class="field">Din publisering<textarea id="mine" rows="4" readonly></textarea></label></section></main><script src="sfu-config.js"></script><script src="sfu-client.js"></script><script>
const $=id=>document.getElementById(id),sfu=new DartArenaSFU(window.DARTARENA_SFU.workerUrl);let localStream=null,remoteStream=new MediaStream();
function status(t){$('status').textContent=t}
$('publishBtn').onclick=async()=>{const b=$('publishBtn');b.disabled=true;try{status('Starter kamera…');localStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});$('localVideo').srcObject=localStream;await $('localVideo').play().catch(()=>{});status('Publiserer til Cloudflare…');const publication=await sfu.publish(localStream);$('mine').value=JSON.stringify(publication);status('Publisering klar. Kopier feltet «Din publisering» til den andre enheten.')}catch(e){console.error(e);status('Feil: '+e.message);b.disabled=false;}};
$('subscribeBtn').onclick=async()=>{try{const publication=JSON.parse($('publication').value.trim());remoteStream=new MediaStream();$('remoteVideo').srcObject=remoteStream;status('Kobler til videostrøm…');await sfu.subscribe(publication,e=>{const tracks=e.streams?.[0]?.getTracks()||[e.track];for(const track of tracks)if(!remoteStream.getTracks().some(t=>t.id===track.id))remoteStream.addTrack(track);$('remoteVideo').play().catch(()=>{});status('Video mottas via Cloudflare SFU.');});}catch(e){console.error(e);status('Feil: '+e.message);}};
window.addEventListener('beforeunload',()=>{localStream?.getTracks().forEach(t=>t.stop());sfu.close()});
</script></body></html>
