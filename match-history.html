<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071012">
  <title>DartArena • Kamphistorikk</title>
  <link rel="stylesheet" href="style.css?v=20260928-ui2">
  <link rel="stylesheet" href="dartboard-background.css?v=20260928-ui2">
  <link rel="stylesheet" href="button-theme.css?v=20261009-brandcyan1">
  <style>
    .history-wrap{max-width:1120px;margin:0 auto}.history-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.history-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}.history-filters{display:flex;gap:7px;flex-wrap:wrap}.history-filter{min-height:36px;padding:8px 12px}.history-filter.active{border-color:rgba(0,234,244,.7)!important;background:rgba(0,234,244,.14)!important;color:#00eaf4!important}.history-options{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.history-mine{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:800;cursor:pointer}.history-mine input{accent-color:var(--cyan);width:17px;height:17px}.history-mine.is-loading{opacity:.55}.history-summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 2px 10px;color:var(--muted);font-size:12px}.history-list{display:grid;gap:10px}.history-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(7,16,18,.72)}.history-main{min-width:0}.history-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px;font-weight:900}.history-player{color:var(--text)!important}.history-player.da-role-owner,.history-player.da-role-admin{color:var(--text)!important}.history-player.winner{color:#F2C14E!important}.history-result{font-size:18px;color:var(--text);font-weight:950;letter-spacing:.03em}.history-meta{display:flex;flex-wrap:wrap;gap:7px 12px;margin-top:6px;color:var(--muted);font-size:13px}.history-tag,.history-game{display:inline-flex;align-items:center;padding:3px 7px;border:1px solid rgba(0,234,244,.25);border-radius:999px;color:#00eaf4;font-size:11px;font-weight:850}.history-game{border-color:rgba(255,255,255,.14);color:var(--text);background:rgba(255,255,255,.035)}.history-extra{color:var(--text)}.history-empty{text-align:center;padding:34px 10px}.history-actions{display:flex;align-items:center;gap:8px}.history-actions:empty{display:none}.history-actions .danger{min-height:36px;padding:8px 12px}@media(max-width:700px){.history-head{flex-direction:column}.history-row{grid-template-columns:1fr}.history-actions{justify-content:flex-start}.history-toolbar{align-items:flex-start}.history-title{font-size:15px}.history-result{font-size:16px}}
  </style>
<link rel="stylesheet" href="brand-header.css?v=20261009-global1"></head>
<body>
  <header><div class="brand"><img class="brand-logo" src="./assets/dartarena-logo.jpg?v=20261009-global1" alt="DartArena" width="420" height="116" decoding="async"></div><div class="live"><i></i> Kamphistorikk</div></header>
  <main class="shell"><div class="history-wrap">
    <div class="history-head"><div><small>ALLE ONLINEKAMPER</small><h1>Kamphistorikk</h1><p class="muted compact">Ferdige kamper mellom DartArena-spillere – X01, Cricket, begge Half-It-variantene, 61 og JDC Challenge.</p></div><button id="backBtn" class="outline">Tilbake til lobby</button></div>
    <div class="history-toolbar">
      <div class="history-filters" id="historyFilters">
        <button class="outline history-filter active" data-filter="all">Alle</button>
        <button class="outline history-filter" data-filter="x01">X01</button>
        <button class="outline history-filter" data-filter="cricket">Cricket</button>
        <button class="outline history-filter" data-filter="half_it_dartcounter">Half-It (DartCounter)</button>
        <button class="outline history-filter" data-filter="half_it_standard">Half-It (Standard)</button>
        <button class="outline history-filter" data-filter="sixty_one">61</button>
        <button class="outline history-filter" data-filter="jdc">JDC</button>
      </div>
      <div class="history-options">
        <label id="showWarmupsLabel" class="history-mine"><input id="showWarmups" type="checkbox"> Vis oppvarmingskamper</label>
        <label class="history-mine"><input id="mineOnly" type="checkbox"> Vis bare mine kamper</label>
      </div>
    </div>
    <div class="history-summary"><span id="historyCount">Laster…</span><span>Nyeste først</span></div>
    <section class="card"><div id="historyList" class="history-list"><p class="muted history-empty">Laster kamper…</p></div></section>
  </div></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="match-history.js?v=20261006-adminstats1"></script>
  <script src="match-history-warmups.js?v=20261001-warmup1"></script>
  <script src="role-visuals.js?v=20261004-historyroles3"></script>
  <script src="brand-home.js?v=20261006-authsmooth3"></script>
</body>
</html>
