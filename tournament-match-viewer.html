<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071012">
  <title>DartArena • Live kamp</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dartboard-background.css">
  <style>
    .viewer-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}
    .viewer-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid rgba(255,255,255,.1);border-radius:999px;color:var(--muted);font-size:13px;font-weight:700}
    .viewer-pill i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
    .spectator-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:30px 18px}
    .spectator-player{text-align:center}
    .spectator-name{font-size:clamp(20px,4vw,34px);font-weight:900}
    .spectator-legs{font-size:clamp(48px,10vw,92px);font-weight:900;line-height:1;margin-top:12px}
    .spectator-vs{color:var(--muted);font-weight:800}
    .spectator-note{text-align:center;margin-top:16px}
    @media(max-width:600px){.viewer-head{align-items:flex-start;flex-direction:column}.spectator-score{gap:8px;padding:24px 8px}}
  </style>
</head>
<body>
  <header>
    <div class="brand">DART<span>ARENA</span></div>
    <div class="live"><i></i> LIVE KAMP</div>
  </header>

  <main class="shell">
    <div class="viewer-head">
      <div>
        <small>TILSKUERMODUS</small>
        <h1 id="title">Laster kamp…</h1>
        <p id="meta" class="muted compact"></p>
      </div>
      <div class="top-actions">
        <div class="viewer-pill"><i></i><b id="viewerCount">0</b> ser på</div>
        <button id="closeBtn" class="outline">Tilbake</button>
      </div>
    </div>

    <section class="card">
      <div class="spectator-score">
        <div class="spectator-player">
          <div id="p1" class="spectator-name">Spiller 1</div>
          <div id="l1" class="spectator-legs">0</div>
        </div>
        <div class="spectator-vs">LEGS</div>
        <div class="spectator-player">
          <div id="p2" class="spectator-name">Spiller 2</div>
          <div id="l2" class="spectator-legs">0</div>
        </div>
      </div>
      <div id="status" class="spectator-note muted">Venter…</div>
    </section>

    <p class="muted spectator-note">Live video for tilskuere kobles på separat. Denne visningen følger kampstatus og leg-resultat i sanntid.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="tournament-match-viewer.js?v=20260926-3"></script>
</body>
</html>
