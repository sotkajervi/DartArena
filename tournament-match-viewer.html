<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071012">
  <title>DartArena • Live kamp</title>
  <link rel="stylesheet" href="style.css?v=20260928-ui2">
  <link rel="stylesheet" href="dartboard-background.css?v=20260928-ui2">
  <link rel="stylesheet" href="button-theme.css?v=20261009-brandcyan1">
  <style>
    .viewer-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.viewer-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid rgba(255,255,255,.1);border-radius:999px;color:var(--muted);font-size:13px;font-weight:700}.viewer-pill i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}.spectator-videos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}.spectator-video-card{aspect-ratio:16/9;background:#030708;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}.spectator-video-card video{width:100%;height:100%;object-fit:contain;background:#030708}.spectator-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}.spectator-video-name{position:absolute;left:12px;bottom:10px;background:#061012d9;border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-weight:800}.spectator-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:22px 18px}.spectator-player{text-align:center;border-radius:14px;padding:10px 12px;transition:background .18s ease,box-shadow .18s ease,border-color .18s ease;border:1px solid transparent}.spectator-player.active-turn{background:rgba(0,234,244,.09);border-color:rgba(0,234,244,.45);box-shadow:inset 0 0 0 1px rgba(0,234,244,.18),0 0 24px rgba(0,234,244,.08)}.spectator-player.active-turn .spectator-name,.spectator-player.active-turn .spectator-points{color:#00eaf4}.spectator-video-card{transition:border-color .18s ease,box-shadow .18s ease}.spectator-video-card.active-turn{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(0,234,244,.38),0 0 28px rgba(0,234,244,.14)}.spectator-name{font-size:clamp(18px,3vw,28px);font-weight:900}.spectator-points{font-size:clamp(40px,8vw,72px);font-weight:950;line-height:1;margin-top:8px}.spectator-legs{color:#00eaf4;font-size:14px;font-weight:900;margin-top:5px}.spectator-vs{color:var(--muted);font-weight:800}.spectator-cricket-board{display:none;max-width:620px;margin:4px auto 10px;border:1px solid rgba(0,234,244,.18);border-radius:14px;overflow:hidden;background:rgba(3,12,14,.42)}.spectator-cricket-board.active{display:block}.spectator-cricket-head,.spectator-cricket-row{display:grid;grid-template-columns:minmax(0,1fr) 82px minmax(0,1fr);align-items:center;text-align:center}.spectator-cricket-head{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:900;color:var(--muted)}.spectator-cricket-head strong{color:#00eaf4;font-size:15px}.spectator-cricket-row{min-height:40px;border-bottom:1px solid rgba(255,255,255,.06)}.spectator-cricket-row:last-child{border-bottom:0}.spectator-cricket-mark{font-size:24px;font-weight:950;color:var(--text)}.spectator-cricket-mark.closed{color:#00eaf4}.spectator-cricket-target{font-size:17px;font-weight:950;color:var(--text)}.spectator-cricket-row.both-closed{opacity:.55}.spectator-note{text-align:center;margin-top:14px}@media(max-width:700px){.viewer-head{align-items:flex-start;flex-direction:column}.spectator-videos{grid-template-columns:1fr}.spectator-score{gap:8px;padding:18px 6px}}
    .spectator-stats-card{margin-top:16px}.spectator-stats-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.spectator-stats-heading h2{margin:0;font-size:20px}.spectator-stats-table{width:100%;table-layout:fixed;border-collapse:collapse}.spectator-stats-table th,.spectator-stats-table td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center;overflow-wrap:anywhere}.spectator-stats-table th:first-child{text-align:left;width:40%}.spectator-stats-table thead th{color:#00eaf4}.spectator-stats-table tbody th{color:var(--muted);font-size:13px;font-weight:500}.spectator-stats-table td{font-weight:850}@media(max-width:480px){.spectator-stats-table th,.spectator-stats-table td{padding:9px 4px;font-size:12px}.spectator-stats-heading{align-items:flex-start;flex-direction:column;gap:4px}}
  </style>
<link rel="stylesheet" href="brand-header.css?v=20261009-mobile1"></head>
<body>
  <header><div class="brand"><img class="brand-logo" src="./assets/dartarena-logo.jpg?v=20261009-global1" alt="DartArena" width="420" height="116" decoding="async"></div><div class="live"><i></i> LIVE KAMP</div></header>
  <main class="shell">
    <div class="viewer-head">
      <div><small>TILSKUERMODUS</small><h1 id="title">Laster kamp…</h1><p id="meta" class="muted compact"></p></div>
      <div class="top-actions"><div class="viewer-pill"><i></i><b id="viewerCount">0</b> ser på</div><button id="closeBtn" class="outline">Lukk tilskuervisning</button></div>
    </div>
    <div class="spectator-videos">
      <div id="p1VideoCard" class="spectator-video-card"><video id="p1Video" autoplay playsinline muted></video><div id="p1Placeholder" class="spectator-placeholder">Venter på kamera…</div><span id="p1VideoName" class="spectator-video-name">Spiller 1</span></div>
      <div id="p2VideoCard" class="spectator-video-card"><video id="p2Video" autoplay playsinline muted></video><div id="p2Placeholder" class="spectator-placeholder">Venter på kamera…</div><span id="p2VideoName" class="spectator-video-name">Spiller 2</span></div>
    </div>
    <section class="card">
      <div class="spectator-score">
        <div id="p1PlayerCard" class="spectator-player"><div id="p1" class="spectator-name">Spiller 1</div><div id="s1" class="spectator-points">501</div><div id="l1" class="spectator-legs">0 legs</div></div>
        <div class="spectator-vs">VS</div>
        <div id="p2PlayerCard" class="spectator-player"><div id="p2" class="spectator-name">Spiller 2</div><div id="s2" class="spectator-points">501</div><div id="l2" class="spectator-legs">0 legs</div></div>
      </div>
      <div id="spectatorCricketBoard" class="spectator-cricket-board" aria-label="Cricket status"></div>
      <div id="status" class="spectator-note muted">Kobler til livekamp…</div>
    </section>
    <section class="card spectator-stats-card" aria-label="Kampstatistikk">
      <div class="spectator-stats-heading"><h2>Kampstatistikk</h2><small id="spectatorStatsState">HELE KAMPEN</small></div>
      <div id="spectatorStats"><p class="muted">Laster kampstatistikk…</p></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="sfu-config.js?v=20260928-ui2"></script>
  <script src="sfu-client.js?v=20260928-ui2"></script>
  <script src="x01-stats.js?v=20260929-first9a"></script>
  <script src="tournament-match-viewer.js?v=20261006-turnhighlight1"></script>
  <script src="tournament-viewer-presence-names.js?v=20261004-viewers3"></script>
  <script src="tournament-match-game-meta.js?v=20261006-splitformat1"></script>
  <script src="role-visuals.js?v=20260928-ui2"></script>
  <script src="brand-home.js?v=20261001-home1"></script>
</body>
</html>
